name: CI

# Run the test suites that gate romp: the Python pipeline (kernel/, cli/,
# postal/), the shell surfaces (tmux hooks / postal / manager), and the VS Code
# extension build.
#
# LINUX runs on every push and PR — it is free on a public repo, no minute cap.
# macOS is BILLED even on a public repo (larger runners always are, at ~10x), and
# the bats suite alone is ~16 macOS-minutes = ~160 billable minutes per run, so
# it does NOT run automatically. Trigger it by hand from the Actions tab ("Run
# workflow") when you want a cross-platform check before a release or after
# touching a platform-sensitive surface (tmux, launchd, the folder opener).
# On a macOS dev box, the pre-push hook runs the same suites locally, so the
# common macOS-only breakages (a real browser opening, a tmux-binary dependency)
# are caught before the push rather than waiting on this manual run.
#
# Python spans 3.10 (the floor docs/install.md promises) through 3.13 (the dev
# version); the older versions run on Linux only, since a version gap and a
# platform gap rarely fail the same way.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # the manual on-switch for the macOS cells (see above)

# A newer push to a PULL REQUEST cancels the older in-flight run of the same
# kind: the new head supersedes the old one, and the old verdict is moot. The
# event is part of the key on purpose: a release dispatch (the macOS gate)
# shares main's ref with every push, and a bare ref key let an auto-merged PR
# cancel the in-flight release run mid-watch (2026-07-27).
# Pushes to main are keyed on the commit sha and never cancelled: main's CI
# must never cancel itself. With one group per ref, two merges in quick
# succession cancelled the first merge's run, and a red main (2e9d4492,
# 2026-09-08) went unseen until a later run happened to fail; a queue would
# not do either, since a group holds at most one pending run and a third merge
# would replace the second's. One group per merge commit, so every merge gets
# its own completed run. A dispatch queues rather than cancels for the same
# reason: a release gate mid-watch is not superseded by a second dispatch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every job is time-boxed. Without this a test that BLOCKS (waiting on a tmux
    # server, a socket, a prompt that never comes) burns the 6h default before
    # anyone finds out, and a required check that hangs blocks merges silently.
    # T230b follow-up (the review's catch): the job cap must EXCEED the pytest phase plus the
    # 600 s per-test timeout plus setup, or a stall that begins late in the run is killed by
    # this cap first - the identical silence the per-test timeout exists to end. Measured pytest
    # phases run 160-300 s, so 15 min left ~100 s of headroom; 25 min = 300 + 600 + setup, with
    # margin for a slow runner.
    timeout-minutes: 25
    strategy:
      # One red cell must not hide the others: a 3.10-only break and a
      # macOS-only break look identical if the matrix stops at the first.
      fail-fast: false
      matrix:
        # macOS is in the matrix ONLY on a manual run (workflow_dispatch); a
        # normal push/PR gets Linux alone. See the billing note in the header.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        python-version: ['3.10', '3.13']
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        # cryptography: the kernel's Web Push soft dependency (plans/ios-app.md). Installed here
        # so tests/test_kernel_webpush.py's crypto layers RUN in CI instead of skipping — the
        # kernel itself still degrades loudly without it (that path has its own test).
        run: python -m pip install --upgrade pip pytest pytest-timeout cryptography
      - name: Run pytest
        # T230b: a hung test used to be 15 minutes of silence (five jobs since 2026-08-27, a
        # process-global time.sleep patch consumed by a foreign thread). pytest-timeout turns the
        # NEXT stall into a named failure with every thread's stack: thread method = guaranteed
        # termination (the process ends; the dump's bottom frame is the blocked primitive, and the
        # hung test is the lowest tests/ frame above the _pytest/runner frames) - the signal
        # method cannot interrupt a C call. 600 s strictly exceeds the slowest legitimate test
        # (~122 s, leak-scaled) and the 300 s child timeout in test_session_move_live. Its timer
        # waits on an Event, so it can never itself consume a patched sleep. --durations names the
        # slowest tests on every run so a creeping one is visible before it stalls.
        run: python -m pytest -q --durations=10 --timeout=600 --timeout-method=thread

  shell:
    name: Shell (bats, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Generous vs the python jobs on purpose: the suite takes ~1min on Linux but
    # ~16min on macOS, so anything near 15 would kill a PASSING job.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # macOS only on a manual run (workflow_dispatch); see the header note.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      # bats comes from the pinned release tarball, NOT apt: an Azure apt-mirror outage hung
      # `apt-get update` to the job timeout three runs in a row (2026-08-19, ~35 wasted minutes
      # each). GitHub itself is already on the critical path (checkout), so this adds no new
      # dependency — and no bats test needs a real tmux (every suite PATH-prepends its own mock),
      # so nothing else is installed at all. The step timeout kills any residual network hang in
      # minutes instead of letting it eat the job's budget.
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 -o /tmp/bats.tar.gz \
            https://github.com/bats-core/bats-core/archive/refs/tags/v1.11.1.tar.gz
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo /tmp/bats-core-1.11.1/install.sh /usr/local
      - name: Install bats + tmux (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install bats-core tmux
      - name: Run bats
        run: bats --print-output-on-failure tests/*.bats
      # T224: the manager<->kernel handshake proof (tests/manager-*.test.js: restart coalescing, the
      # quiet-window chain, the drain-lease refusal notices) ran only by hand until now. It runs HERE,
      # inside a check the upstream ruleset already REQUIRES, so a red handshake blocks the merge -
      # a standalone job would have gone red while auto-merge landed the PR anyway (the ruleset lists
      # six contexts and adding one is an owner-side change). node's built-in runner, no deps, no
      # continue-on-error; the runtime is pinned so the step never rides whatever node the image has.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manager handshake tests (node --test)
        run: node --test tests/manager-*.test.js

  vscode-extension:
    name: vscode-extension (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Resolved from the REPO ROOT, not from defaults.run.working-directory.
          # A wrong path here fails the job outright ("Some specified paths were
          # not resolved"), which is what a stale chat-view/ path did until the
          # directory was renamed to vscode-extension/.
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Dashboard pane bench (node --test)
        # tools/ui-bench.mjs replays a synthetic frame stream into the real feed and timeline pages in a
        # headless Chrome (the runner image's Google Chrome through playwright's channel option, so no
        # browser download), served by the kernel's own page route from the dist the Build step just
        # wrote; python3 comes with the image. The test file lives at the repo root, hence the
        # working-directory override of the job's vscode-extension/ default. On a contributor's machine
        # the browser tests skip, and say why, when no browser, python3 or dist is present. Here
        # ROMP_UI_BENCH_REQUIRE makes that skip a failure: this is the only CI run of the real pane
        # bundles, and a runner image that drops Chrome from PATH must turn the job red rather than
        # green with the coverage gone (the same stance as the cryptography install above, which exists
        # so its tests RUN).
        working-directory: ${{ github.workspace }}
        env:
          ROMP_UI_BENCH_REQUIRE: "1"
        run: node --test tests/ui-bench.test.mjs
